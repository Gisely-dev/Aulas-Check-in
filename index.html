<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in PEX2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{margin:0;min-height:100vh;background:#fafafa;display:flex;align-items:center;justify-content:center;padding:24px;color:#111}
.card{width:100%;max-width:380px;background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:28px}
.head{margin-bottom:28px}
.head .badge{width:32px;height:32px;border-radius:9px;background:#111;color:#fff;display:grid;place-items:center;font-size:14px;margin-bottom:14px}
.head h2{margin:0;font-size:20px;letter-spacing:-.04em;font-weight:700}
.head p{margin:6px 0 0;font-size:13px;color:#888}
label{font-size:11px;font-weight:600;letter-spacing:.06em;color:#999;text-transform:uppercase;margin:18px 0 8px;display:block}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #e5e5e5;background:#fafafa;color:#111;outline:none;font-size:14px;transition:.15s}
input:focus,select:focus{background:#fff;border-color:#111}
input::placeholder{color:#bbb}
button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
button:hover{background:#000}
button:active{transform:scale(.98)}
button:disabled{opacity:.5}
#ok{display:none;margin-top:14px;background:#f4f4f5;border:1px solid #e5e5e5;padding:12px;border-radius:12px;text-align:center;font-size:13px;font-weight:500}
</style>
</head>
<body>
<div class="card">
<div class="head">
<div class="badge">🧑🏽‍💻</div>
<h2>Check-in PEX2</h2>
<p>Presença rápida e direta.</p>
</div>

<label>Nome</label>
<input id="nome" placeholder="Seu nome completo *">

<label>Turma</label>
<select id="turma"><option value="">Selecione *</option><option>Manhã</option><option>Tarde</option><option>EAD</option></select>

<label>Data da aula</label>
<input type="date" id="data">

<label>Assunto</label>
<input id="assunto" placeholder="Tema da aula *">

<label>Nota</label>
<select id="nota"><option value="">De 1 a 5 *</option><option>1 - Não entendi</option><option>2 - Entendi pouco</option><option>3 - Fiquei com dúvidas</option><option>4 - Entendi</option><option>5 - Entendi tudo</option></select>

<button onclick="enviar()" id="btn">Enviar</button>
<div id="ok"></div>
</div>

<script>
const TOPICO = "pex2-gisely-2026";
data.valueAsDate = new Date();

async function enviar(){
 let n=nome.value.trim(), t=turma.value, d=data.value, a=assunto.value.trim(), no=nota.value;
 if(!n||!t||!d||!a||!no){alert('Preencha tudo: nome, turma, data, assunto e nota');return}
 let agora=new Date();
 let hora=agora.toLocaleTimeString('pt-BR');
 let dataC=agora.toLocaleDateString('pt-BR');
 let btn=document.getElementById('btn');
 btn.innerText='Enviando...'; btn.disabled=true;

 try{
  await fetch(`https://ntfy.sh/${TOPICO}`,{
   method:'POST',
   body:`Nome: ${n}\nTurma: ${t}\nData: ${d}\nAssunto: ${a}\nNota: ${no}\nHora: ${dataC} ${hora}`,
   headers:{'Title':`Check-in: ${n}`,'Priority':'high'}
  });
 }catch(e){}

 btn.innerText='Enviar'; btn.disabled=false;
 let ok=document.getElementById('ok');
 ok.style.display='block';
 ok.innerText=`Enviado às ${hora} • Valeu, ${n.split(' ')[0]}!`;
 nome.value=''; turma.value=''; assunto.value=''; nota.value='';
}
</script>
</body>
</html>
